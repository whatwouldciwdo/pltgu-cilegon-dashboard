<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bgGrad)" />

  <!-- Grid accent lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="320" x2="640" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Sun Graphic with Glow -->
  <circle cx="320" cy="140" r="50" fill="url(#sunGrad)" filter="url(#glow)" />
  <circle cx="320" cy="140" r="46" fill="url(#sunGrad)" />

  <!-- Sun Rays / Solar Waves -->
  <g stroke="url(#sunGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="320" y1="70" x2="320" y2="55" />
    <line x1="320" y1="210" x2="320" y2="225" />
    <line x1="250" y1="140" x2="235" y2="140" />
    <line x1="390" y1="140" x2="405" y2="140" />
    <line x1="270" y1="90" x2="258" y2="78" />
    <line x1="370" y1="190" x2="382" y2="202" />
    <line x1="270" y1="190" x2="258" y2="202" />
    <line x1="370" y1="90" x2="382" y2="78" />
  </g>

  <!-- Solar Cell Grid in Sun Center -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.75">
    <path d="M 296 120 L 344 120 L 350 160 L 290 160 Z" />
    <line x1="320" y1="120" x2="320" y2="160" />
    <line x1="293" y1="140" x2="347" y2="140" />
  </g>

  <!-- Text -->
  <text x="320" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    iSolar<tspan fill="#f59e0b">Cloud</tspan>
  </text>
  <text x="320" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    SUNGROW PV MONITORING SYSTEM
  </text>
</svg>
