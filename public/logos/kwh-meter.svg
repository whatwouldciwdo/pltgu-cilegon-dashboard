<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bgGrad2)" />

  <!-- Subtle circuit lines in background -->
  <g opacity="0.15" stroke="#34d399" stroke-width="1.5" fill="none">
    <path d="M 50 100 H 200 L 250 150 H 400" />
    <path d="M 600 300 H 450 L 400 250 H 250" />
    <circle cx="200" cy="100" r="4" fill="#34d399" />
    <circle cx="450" cy="300" r="4" fill="#34d399" />
  </g>

  <!-- Gauge Arc / KwH Meter Graphic -->
  <g transform="translate(320, 150)">
    <!-- Outer Track -->
    <path d="M -70 20 A 75 75 0 1 1 70 20" fill="none" stroke="#134e4a" stroke-width="14" stroke-linecap="round" />
    <!-- Active Arc -->
    <path d="M -70 20 A 75 75 0 1 1 45 -60" fill="none" stroke="url(#dialGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow2)" />
    
    <!-- Central Value Display -->
    <rect x="-45" y="-15" width="90" height="32" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
    <text x="0" y="7" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="2">
      kWh
    </text>

    <!-- Lightning Bolt / Energy icon -->
    <path d="M -4 -42 L 3 -42 L -1 -30 L 5 -30 L -5 -16 L -2 -28 L -6 -28 Z" fill="#fbbf24" filter="url(#glow2)" />
  </g>

  <!-- Text -->
  <text x="320" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Smart <tspan fill="#34d399">KwH Meter</tspan>
  </text>
  <text x="320" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">
    SMART POWER MONITORING SYSTEM
  </text>
</svg>
